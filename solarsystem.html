<!DOCTYPE html>
<html>
<head>
<title>3D Solar System</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    background: radial-gradient(circle, #10152f, #000);
    font-family: Arial;
}

h1 {
    position: fixed;
    top: 15px;
    left: 25px;
    color: white;
    z-index: 10;
}

.space {
    width: 100vw;
    height: 100vh;
    position: relative;
    perspective: 900px;
}

.system {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 0;
    height: 0;
    transform-style: preserve-3d;
}

.sun {
    position: absolute;
    width: 90px;
    height: 90px;
    margin-left: -45px;
    margin-top: -45px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff700, #ff8c00, #ff4500);
    box-shadow: 0 0 40px #ff9900, 0 0 80px #ff6600;
}

.orbit {
    position: absolute;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 50%;
    transform: translate(-50%, -50%) rotateX(65deg);
}

.planet {
    position: absolute;
    border-radius: 50%;
    transform: translate(-50%, -50%);
}

.mercury-orbit { width: 150px; height: 150px; }
.venus-orbit   { width: 210px; height: 210px; }
.earth-orbit   { width: 280px; height: 280px; }
.mars-orbit    { width: 350px; height: 350px; }
.jupiter-orbit { width: 450px; height: 450px; }
.saturn-orbit  { width: 550px; height: 550px; }
.uranus-orbit  { width: 650px; height: 650px; }
.neptune-orbit { width: 750px; height: 750px; }

.mercury {
    width: 14px;
    height: 14px;
    background: #aaa;
}

.venus {
    width: 20px;
    height: 20px;
    background: #d89b55;
}

.earth {
    width: 24px;
    height: 24px;
    background: #247cff;
}

.mars {
    width: 19px;
    height: 19px;
    background: #e33b20;
}

.jupiter {
    width: 48px;
    height: 48px;
    background: #c88b55;
}

.saturn {
    width: 40px;
    height: 40px;
    background: #d9c27a;
}

.uranus {
    width: 30px;
    height: 30px;
    background: #6bd5e5;
}

.neptune {
    width: 30px;
    height: 30px;
    background: #4169e1;
}

.saturn-ring {
    position: absolute;
    width: 65px;
    height: 22px;
    border: 4px solid #d8c99b;
    border-radius: 50%;
    transform: translate(-50%, -50%) rotateX(65deg);
}
</style>
</head>

<body>

<h1>🌌 3D Solar System</h1>

<div class="space">

<div class="system">

<div class="sun"></div>

<div class="orbit mercury-orbit">
    <div class="planet mercury"></div>
</div>

<div class="orbit venus-orbit">
    <div class="planet venus"></div>
</div>

<div class="orbit earth-orbit">
    <div class="planet earth"></div>
</div>

<div class="orbit mars-orbit">
    <div class="planet mars"></div>
</div>

<div class="orbit jupiter-orbit">
    <div class="planet jupiter"></div>
</div>

<div class="orbit saturn-orbit">
    <div class="planet saturn"></div>
    <div class="saturn-ring"></div>
</div>

<div class="orbit uranus-orbit">
    <div class="planet uranus"></div>
</div>

<div class="orbit neptune-orbit">
    <div class="planet neptune"></div>
</div>

</div>
</div>

<script>

let angle = 0;

function animate() {

    angle += 0.3;

    let planets = document.querySelectorAll(".orbit");

    planets.forEach((orbit, index) => {

        let speed = 1 - index * 0.1;

        orbit.style.transform =
            "translate(-50%, -50%) rotateX(65deg) rotateZ(" +
            (angle * speed) + "deg)";

    });

    requestAnimationFrame(animate);
}

animate();

</script>

</body>
</html>
